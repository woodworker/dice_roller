[package]
name = "dice_roller"
version = "0.1.0"
edition = "2021"
authors = ["Martin Holzhauer <martin@holzhauer.eu>"]
description = "A comprehensive CLI dice roller supporting Roll20-style notation"
license = "MIT"
repository = "https://github.com/woodworker/dice_roller"

[[bin]]
name = "dice_roller"
path = "src/main.rs"

[lib]
name = "dice_roller"
path = "src/lib.rs"

[dependencies]
rand = "0.8"
clap = { version = "4.5", features = ["derive", "color"] }
colored = "2.1"
thiserror = "1.0"
regex = "1.10"

[dev-dependencies]
proptest = "1.4"
